<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000}

  #sk{position:absolute;left:0;top:0}
  .s{stroke:#151515;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}

  .s.d{stroke-width:4.5}
  .s.brow{stroke-width:11}
  .s.guide{stroke:transparent}

  .hz{stroke:#2a2a2a;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.75}

  .back{transform:rotateY(180deg)}
  #hand{position:absolute;left:0;top:0;width:1257px;transform-origin:0 0;filter:drop-shadow(-26px 34px 26px rgba(0,0,0,.28));opacity:0}

  #caps{position:absolute;left:40px;right:40px;top:1500px;display:flex;justify-content:center;direction:rtl;flex-wrap:wrap;gap:4px 16px}
  #caps span{font-family:Cairo;font-weight:900;font-size:66px;line-height:1.3;color:#fff;padding:0 14px;border-radius:14px;
     -webkit-text-stroke:0;text-shadow:0 0 2px #000,0 4px 0 #000,3px 3px 0 #000,-3px 3px 0 #000,3px -2px 0 #000,-3px -2px 0 #000;display:inline-block}
  #caps span.on{background:#ffd23f;color:#151515;text-shadow:none;box-shadow:0 6px 0 #151515}
  #caps span.hi{color:#ffd23f}
  #kin{position:absolute;left:0;right:0;top:120px;text-align:center;direction:rtl}
  #k1{font-family:Marhey;font-weight:700;font-size:84px;color:#151515;display:inline-block}
  #k2{font-family:Lalezar;font-size:230px;line-height:1.05;color:#ffc02e;display:inline-block;
      text-shadow:0 8px 0 #151515,0 0 40px rgba(255,190,40,.55);-webkit-text-stroke:6px #151515;paint-order:stroke fill}
  #bar{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#ffc02e,#ff6a3d)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  #redv{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(229,57,53,0) 45%,rgba(229,57,53,.55) 100%);opacity:0}
  #burst{position:absolute;left:540px;top:930px;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);opacity:0;
     background:radial-gradient(circle,rgba(255,210,63,0) 55%,rgba(255,210,63,.9) 62%,rgba(255,106,61,.6) 70%,rgba(255,106,61,0) 78%)}
  #wipe{position:absolute;top:-200px;height:2400px;width:900px;left:1200px;transform:skewX(-12deg);
     background:linear-gradient(90deg,rgba(255,255,255,0),#f4f5f6 18%,#f4f5f6 82%,rgba(255,255,255,0))}
  #logoEnd{position:absolute;left:430px;top:1510px;width:220px;opacity:0}
  #follow{position:absolute;left:0;right:0;top:1760px;text-align:center;font-family:Cairo;font-weight:900;font-size:44px;color:#151515;opacity:0;direction:rtl}
  #wm{position:absolute;right:40px;top:40px;width:110px;opacity:.95}

  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22) 100%)}
  #grain{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;background:url(img/grain.png);background-size:540px 960px;opacity:.07;mix-blend-mode:overlay}

</style>

<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,d)=>clamp((t-a)/d);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const back=(x,s=1.9)=>{x=clamp(x)-1;return 1+x*x*((s+1)*x+s)};
const elastic=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};

// ---------- doodle person builder ----------
function P_(g,d,cls='s',fill){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',cls);if(fill){p.setAttribute('fill',fill);} g.appendChild(p);return p;}
function person(g,o){
  const fills={};const O='s o',D='s d';
  const fo=(d,c,op)=>{const p=P_(g,d,'fo',c);if(op!==undefined)p.dataset.op=op;return p;};
  // ---- fill layers (fade in after line art) ----
  fills.shirt=fo('M-30,150 C-80,156 -130,170 -152,200 C-166,222 -172,300 -172,480 L172,480 C172,300 166,222 152,200 C130,170 80,156 30,150 C16,178 -16,178 -30,150 Z','#ffffff');
  fills.skin=fo('M-98,-30 C-100,40 -72,108 0,118 C72,108 100,40 98,-30 C98,-130 -98,-130 -98,-30 Z M-28,108 L-30,156 L30,156 L28,108 Z M-97,-8 C-124,-20 -130,18 -116,34 C-108,44 -98,42 -93,36 Z M97,-8 C124,-20 130,18 116,34 C108,44 98,42 93,36 Z','#ffffff');
  if(o.arms!=='cross'){
    fills.armL=fo(o.arms==='play'?'':'M-172,318 C-186,370 -190,420 -186,460 C-192,492 -178,512 -160,512 C-140,512 -132,490 -136,460 C-134,420 -130,370 -124,322 Z','#ffffff');
    fills.armR=fo(o.arms==='play'?'':'M172,318 C186,370 190,420 186,460 C192,492 178,512 160,512 C140,512 132,490 136,460 C134,420 130,370 124,322 Z','#ffffff');
  }
  if(o.beard) fills.beard=fo('M-96,-2 C-94,64 -58,130 0,134 C58,130 94,64 96,-2 C88,36 66,62 44,66 C22,80 -22,80 -44,66 C-66,62 -88,36 -96,-2 Z','#ffffff');
  // cel shading (colour phase only)
  const shade=[];
  shade.push(fo('M-98,-30 C-60,-8 -20,-14 10,-38 C40,-18 80,-12 98,-30 L98,-44 L-98,-44 Z','#000','.13'));
  shade.push(fo('M-28,112 C-10,142 10,142 28,112 L30,156 L-30,156 Z','#000','.2'));
  shade.push(fo('M172,480 C172,300 166,222 152,200 C140,260 124,380 116,480 Z','#000','.13'));
  shade.push(fo('M-62,52 m-20,0 a20,10 0 1 0 40,0 a20,10 0 1 0 -40,0 M62,52 m-20,0 a20,10 0 1 0 40,0 a20,10 0 1 0 -40,0','#ff6b6b','.35'));
  fills.shade=shade;
  // ---- line art in drawing order ----
  P_(g,'M-98,-30 C-100,40 -72,108 0,118 C72,108 100,40 98,-30',O);
  const H={spiky:'M-108,-22 C-126,-100 -92,-162 -30,-170 C-18,-192 22,-196 42,-176 C82,-180 116,-140 110,-70 C112,-50 108,-36 100,-24 C90,-60 74,-80 54,-86 C48,-70 34,-60 18,-62 C24,-76 18,-88 10,-92 C-2,-70 -42,-60 -70,-64 C-86,-60 -100,-44 -108,-22 Z',
     curly:'M-104,-26 C-122,-70 -112,-122 -82,-132 C-72,-162 -30,-172 -10,-156 C10,-178 56,-172 70,-146 C102,-140 120,-100 104,-26 C96,-60 84,-78 60,-90 C30,-74 -30,-74 -60,-92 C-82,-80 -96,-60 -104,-26 Z',
     round:'M-104,-30 C-112,-112 -60,-152 0,-152 C60,-152 112,-112 104,-30 C95,-70 80,-90 60,-96 C40,-80 -40,-80 -60,-96 C-80,-90 -95,-70 -104,-30 Z'};
  fills.hair=P_(g,H[o.hair],'s o f','#ffffff');
  if(o.hair==='spiky')P_(g,'M-62,-124 C-50,-104 -40,-92 -26,-84 M8,-152 C16,-128 22,-110 28,-98 M62,-132 C72,-112 78,-96 80,-82',D);
  else P_(g,'M-60,-112 C-46,-104 -36,-102 -24,-104 M20,-120 C34,-112 46,-110 58,-114',D);
  P_(g,'M-97,-8 C-124,-20 -130,18 -116,34 C-108,44 -98,42 -93,36',O);

  ['ringL','ringR'].forEach((id,i)=>{const e=$(id),L=e.getTotalLength();const q=eio(P(t,23.1+i*.1,.6));e.style.strokeDasharray=L;e.style.strokeDashoffset=L*(1-q);e.setAttribute('opacity',q>0?1:0);});
  RIel.forEach((r,i)=>{const q=P(t,23.3+i*.15,.45);const a=r.ang*Math.PI/180+(r.ang>90?-1:1)*(t>24.2?Math.sin((t-24.2)*1.1)*0.06:0);const R=430;const x=540-R*Math.cos(a)*(r.ang>90?1:-1)*(r.ang>90?1:1);
    const cx=540+R*Math.cos(a), cy=930+R*Math.sin(a);

    r.d.style.transform=`scale(${back(q,2.2)}) translateY(${t>24?Math.sin(t*2+i)*6:0}px)`;});
  const ll=P(t,24.0,.4),lr=P(t,24.2,.4);
  $('lblL').style.opacity=ll>0?1:0;$('lblL').style.transform=`scale(${back(ll)})`;
  $('lblR').style.opacity=lr>0?1:0;$('lblR').style.transform=`scale(${back(lr)})`;
  const sq=P(t,24.5,.5);$('scale').style.opacity=sq>0?1:0;$('scale').style.transform=`scale(${back(sq)}) rotate(${Math.sin(t*2.5)*6}deg)`;

  // ===== kinetic typography =====
  const k1=P(t,26.3,.45),k2=P(t,27.0,.6);
  $('k1').style.opacity=k1;$('k1').style.transform=`translateY(${(1-eout(k1))*60}px) scale(${0.7+0.3*back(k1)})`;
  $('k2').style.opacity=k2>0?1:0;$('k2').style.transform=`scale(${k2>0?elastic(k2):0}) rotate(${(1-eout(k2))*-10}deg)`;
  $('g-under').style.display=t>=27.55?'':'none';
  // logo & follow
  const le=P(t,28.2,.6);$('logoEnd').style.opacity=eout(le);$('logoEnd').style.transform=`translateY(${(1-eout(le))*50}px) scale(${0.8+0.2*back(le)})`;
  $('follow').style.opacity=eout(P(t,28.6,.4));
  $('wm').style.opacity=t<28.2?0.95*eout(P(t,0.2,.4)):0.95*(1-eout(le));
  // flashes
  const fl=Math.max(Math.exp(-Math.pow((t-4.6)/0.06,2))*0.5,Math.exp(-Math.pow((t-13.0)/0.08,2))*0.7,Math.exp(-Math.pow((t-27.05)/0.08,2))*0.6);
  $('flash').style.opacity=fl;

}
function pop(id,t0,tOut,tr,bobK){const q=P(tr,t0,.5);const o=1-eout(P(tr,tOut,.35));const el=$(id);
  el.style.opacity=(q>0&&o>0)?1:0;const b=Math.sin(tr*2.2+(bobK||0))*7;
  el.style.transform=`translateY(${b+(1-eout(q))*70}px) scale(${back(q,2.2)*o})`;}
function midScenes(tr){
  const inMid=tr>=22&&tr<42;
  ['g-chart','g-dumb'].forEach(id=>$(id).style.display=(tr>=22.9&&tr<32.6)?'':'none');
  $('g-quote').style.display='none';
  $('quoteTxt').style.display=(tr>=38.4&&tr<42.2)?'':'none';
  if(tr>=32.2&&tr<32.6){const o=1-eout(P(tr,32.2,.4));$('g-chart').style.opacity=o;$('g-dumb').style.opacity=o;} else {$('g-chart').style.opacity=1;$('g-dumb').style.opacity=1;}
  ['iLap','iCap','iBall','iTroph','iBic','iFam','iHouse','iHelp','iLove'].forEach(id=>$(id).style.opacity=0);
  if(tr<22){$('iProphet').style.opacity=0;return;}
  // things from scene 3 leave / stay hidden
  const out=1-eout(P(tr,22,.35));
  ['cMat','cCal','cMoon'].forEach(id=>{if(tr<42){$(id).style.opacity=out>0.01?1:0;$(id).style.transform=`perspective(1200px) rotateY(180deg) scale(${out})`;}else $(id).style.opacity=0;});
  ['eLaugh1','eLaugh2','eGrin'].forEach(id=>{$(id).style.opacity=0;});

  $('pad').style.opacity=0;$('car').style.opacity=0;$('confetti').style.display='none';
  $('leak').style.opacity=tr<42?0.45*out:0;
  if(!inMid){$('iProphet').style.opacity=0;return;}
  // man: arms down, gentle breathing
  MAN.arms.style.opacity=1;$('g-play').style.opacity=0;MAN.fills.armL.style.display='';MAN.fills.armR.style.display='';
  $('g-man').setAttribute('transform',`translate(540,${780+Math.sin(tr*3)*3})`);
  // scene A: ambition & health
  pop('iLap',22.5,32.2,tr,0);pop('iCap',23.9,32.2,tr,1);pop('iBall',25.6,32.2,tr,2);
  pop('iTroph',24.2,32.2,tr,3);pop('iBic',27.0,32.2,tr,4);
  // scene B: family & kindness
  pop('iFam',32.5,38.3,tr,0);pop('iHouse',33.7,38.3,tr,1);pop('iHelp',35.6,38.3,tr,2);pop('iLove',36.8,38.3,tr,3);
  // quote reveal driven by the hand's guide paths
  const D=DRAW['g-quote'];const p=P(tr,38.5,2.6);const L1=D.lens[0],L2=D.lens[1];const done=p*(L1+L2);
  const q1=clamp(done/L1),q2=clamp((done-L1)/L2);const [b1,b2]=window.QB;
  const r1=$('qr1'),r2=$('qr2');r1.setAttribute('x',b1.x+b1.width*(1-q1)-10);r1.setAttribute('width',b1.width*q1+20);
  r2.setAttribute('x',b2.x+b2.width*(1-q2)-10);r2.setAttribute('width',b2.width*q2+20);
  const qo=1-eout(P(tr,41.6,.35));$('quoteTxt').style.opacity=qo;
  const pq=P(tr,41.0,.4);$('iProphet').style.opacity=eout(pq)*qo;$('iProphet').style.transform=`translateY(${(1-eout(pq))*20}px)`;
  // camera for the middle scenes
  const ss=tr<32?22:32;const push=1+0.035*eio((tr-ss)/10);
  let punch=1;[[22.5,.035],[25.6,.035],[28.7,.07],[32.4,.06],[35.6,.035],[38.5,.04]].forEach(([ti,a])=>{if(tr>ti)punch+=a*Math.exp(-(tr-ti)*4)*(1-Math.exp(-(tr-ti)*45));});
  $('cam').style.transform=`scale(${push*punch})`;$('cam').style.filter='';
  const fl=Math.exp(-Math.pow((tr-32.3)/0.07,2))*0.45;$('flash').style.opacity=fl;
}
function visible(id,t){
  if(['g-door','g-sad','g-hatch','g-clap'].includes(id))return t<4.6;
  if(id==='g-hookline')return t<4.5;
  if(id==='g-play')return t>=19.05&&t<22;
  if(id==='g-ring')return t>=42.3;
  if(id==='g-under')return t>=47.55;
  if(id==='g-chart'||id==='g-dumb')return t>=22.9&&t<32.2;
  if(id==='g-quote')return t>=38.4&&t<41.9;
  return t>=4.6;
}
window.seek=seek;
function rnd2(x){const v=Math.sin(Math.floor(x)*12.9898)*43758.5453;return v-Math.floor(v);}
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{window.READY=true;seek(0)});
