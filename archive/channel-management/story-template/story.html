<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Cairo',sans-serif;background:#0b0710;color:#fff;position:relative}
.bg{position:absolute;inset:-60px;background:url(poster.jpg) center/cover;filter:blur(40px) brightness(.35) saturate(1.3)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:200px 70px 0}
.badge{background:linear-gradient(90deg,#ff7a18,#ffb800);color:#1a0d00;font-weight:900;font-size:46px;padding:14px 46px;border-radius:60px;box-shadow:0 10px 40px rgba(255,140,0,.45)}
h1{font-weight:900;font-size:118px;line-height:1.15;margin-top:50px;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6)}
h1 span{color:#ffc23a}
.sub{font-weight:600;font-size:46px;opacity:.9;margin-top:18px;text-align:center}
.card{margin-top:70px;width:940px;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);border:4px solid rgba(255,194,58,.55)}
.card img{display:block;width:100%}
.cta{margin-top:80px;font-weight:800;font-size:56px;text-align:center}
.arrow{font-size:90px;line-height:1;margin-top:10px;color:#ffc23a;font-weight:900}
.slot{margin-top:20px;height:220px}
.foot{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:40px;font-weight:600;opacity:.8}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="badge">BADGE</div>
  <h1>TITLE</h1>
  <div class="sub">SUB</div>
  <div class="card"><img src="poster.jpg"></div>
  <div class="cta">CTA</div>
  <div class="arrow">&#8595;</div>
  <div class="slot"></div>
</div>
<div class="foot">يوتيوب: حمدي الديب · <span dir="ltr">@hamdyeldee</span></div>
</body></html>
