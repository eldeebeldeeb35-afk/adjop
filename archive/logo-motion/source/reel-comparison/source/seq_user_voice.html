<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,d)=>clamp((t-a)/d);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const back=(x,s=1.9)=>{x=clamp(x)-1;return 1+x*x*((s+1)*x+s)};
const elastic=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
function rnd2(x){const v=Math.sin(Math.floor(x)*12.9898)*43758.5453;return v-Math.floor(v);}
function G(parent,id,tr){const g=document.createElementNS(NS,'g');g.setAttribute('id',id);if(tr)g.setAttribute('transform',tr);parent.appendChild(g);return g;}
function P_(g,d,cls='s',fill){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',cls);if(fill)p.setAttribute('fill',fill);g.appendChild(p);return p;}
</script>

<script>
// ================= timeline =================
const M0=0, MA=[4.34,7.17,10.48], MX=13.45, BR=15.0, RA=[17.4,23.0,27.55], F=32.95, K2=F+7.4, END=F+11.0;
const MOV=$('movSk'),REAL=$('realSk'),FIN=$('finSk');
// movies scenes (full screen, character centred)
(function(){const g=G(MOV,'m1x');let d='',y=360,dir=1;while(y<1420){const x0=dir>0?110:970,x1=dir>0?970:110;d+=(d?' L':'M')+x0+','+y+' L'+x1+','+(y+22);y+=32;dir*=-1;}P_(g,d,'hz');})();
const SM1=person(G(MOV,'m1','translate(540,800) scale(1.12)'),{style:'stern',mood:'sad',arms:'cross'});
const SM2=person(G(MOV,'m2','translate(470,800) scale(1.12)'),{style:'stern',mood:'angry',arms:'point'});
(function(){const g=G(MOV,'m3x');P_(g,'M420,500 C360,500 360,420 422,420 C430,368 510,354 530,402 C552,348 646,356 650,418 C714,410 726,500 662,500 Z','s o');
  P_(g,'M450,540 l-16,40 M512,540 l-16,40 M574,540 l-16,40 M636,540 l-16,40','s d');})();
const SM3=person(G(MOV,'m3','translate(540,860) scale(1.0)'),{style:'stern',mood:'sad',arms:'down'});
// reality: one young man + friends
const SR_=person(G(REAL,'r1','translate(540,820) scale(1.05)'),{mood:'happy',arms:'down',beard:true});
const FA=person(G(REAL,'r2a','translate(170,1080) scale(.55)'),{hair:'curly',mood:'laugh',arms:'down'});
const FB=person(G(REAL,'r2b','translate(910,1080) scale(.55)'),{hair:'round',mood:'laugh',arms:'down'});
// final
const SF=person(G(FIN,'fm','translate(540,820) scale(.95)'),{mood:'happy',arms:'down',beard:true});
(function(){const g=G(FIN,'fring');P_(g,'M540,480 A440,440 0 1 0 540.1,480','s o');})();
const ringL=P_(FIN,'M540,480 A440,440 0 0 0 540,1360','');ringL.setAttribute('fill','none');ringL.setAttribute('stroke','#16a085');ringL.setAttribute('stroke-width','20');ringL.setAttribute('stroke-linecap','round');
const ringR=P_(FIN,'M540,480 A440,440 0 0 1 540,1360','');ringR.setAttribute('fill','none');ringR.setAttribute('stroke','#ff7a45');ringR.setAttribute('stroke-width','20');ringR.setAttribute('stroke-linecap','round');

// movie tags (what the movies say)
function tag(txt,x,y){const d=document.createElement('div');d.className='tag tagM';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=0;$('tags').appendChild(d);return d;}
const TAGS=[[tag('مكشّر 😠',120,330),MA[0]+1.4,MA[1]],[tag('قافل على نفسه',620,330),MA[0]+1.9,MA[1]],
            [tag('بيزعّق',730,330),MA[1]+1.5,MA[2]],[tag('بيخاصم الناس',90,330),MA[1]+2.1,MA[2]],
            [tag('لوحده',120,330),MA[2]+1.5,BR],[tag('معزول',760,330),MA[2]+2.0,BR]];
// reality icons
const RI=$('realIcons');
const ICONS=[ // el, t0, t1
 [icon(RI,'img/gem_mat.png',50,380,200,'صلاته'),RA[0]+2.0,RA[1]],[icon(RI,'img/gem_mosque.png',820,380,220,'مسجده'),RA[0]+2.4,RA[1]],
 [icon(RI,'img/gem_calendar.png',40,860,210,'صيامه'),RA[0]+3.0,RA[1]],[icon(RI,'img/gem_moon.png',830,860,210,'قيام الليل'),RA[0]+3.6,RA[1]],
 [icon(RI,'img/gem_coffee.png',60,360,250,'قهوة مع الصحاب'),RA[1]+1.6,RA[2]],[icon(RI,'img/gem_laugh.png',830,380,200,'ضحك وهزار'),RA[1]+2.0,RA[2]],
 [icon(RI,'img/gem_controller.png',360,1230,360,''),RA[1]+3.4,RA[2]],
 [icon(RI,'img/gem_parents.png',30,370,280,'أهله'),RA[2]+0.6,F],[icon(RI,'img/red_heart.png',860,380,170,'بِرّ'),RA[2]+1.2,F],
 [icon(RI,'img/laptop.png',50,880,220,'شغله'),RA[2]+2.3,F],[icon(RI,'img/soccer_ball.png',850,890,180,'رياضة'),RA[2]+3.2,F],
];
const FI=$('finIcons');
const RING=[['img/gem_moon.png',212,190],['img/gem_mat.png',180,165],['img/gem_mosque.png',148,190],['img/gem_controller.png',-32,210],['img/gem_coffee.png',0,200],['img/gem_parents.png',32,190]]
 .map(([src,ang,w])=>({el:icon(FI,src,0,0,w,''),ang,w}));
const lblL=document.createElement('div');lblL.className='ic';lblL.style.cssText='left:70px;top:400px;opacity:0';lblL.innerHTML='<div style="background:#16a085;color:#fff;font-family:Cairo;font-weight:900;font-size:46px;padding:4px 34px 10px;border-radius:40px;box-shadow:0 6px 0 #0b5a45">العبادة</div>';FI.appendChild(lblL);
const lblR=document.createElement('div');lblR.className='ic';lblR.style.cssText='left:790px;top:400px;opacity:0';lblR.innerHTML='<div style="background:#ff7a45;color:#fff;font-family:Cairo;font-weight:900;font-size:46px;padding:4px 34px 10px;border-radius:40px;box-shadow:0 6px 0 #b8481f">الحياة</div>';FI.appendChild(lblR);
const scaleIc=icon(FI,'img/balance_scale.png',455,330,170,'');

// drawing segments & visibility windows
const SEG=[['m1x',MA[0]+.05,.35],['m1',MA[0]+.4,1.3],['m2',MA[1]+.15,1.4],['m3x',MA[2]+.05,.4],['m3',MA[2]+.45,1.25],
           ['r1',RA[0]+.1,1.7],['r2a',RA[1]+.2,.7],['r2b',RA[1]+.9,.7],
           ['fm',F+.5,1.2],['fring',F+1.9,.8],['g-under',K2+.55,.35]];
const WIN={m1x:[MA[0],MA[1]],m1:[MA[0],MA[1]],m2:[MA[1],MA[2]],m3x:[MA[2],BR+.2],m3:[MA[2],BR+.2],
           r1:[RA[0],F+.4],r2a:[RA[1],RA[2]],r2b:[RA[1],RA[2]],fm:[F,99],fring:[F,99],'g-under':[K2+.5,99]};
Object.keys(WIN).forEach(prep);

// captions = voiceover
const VO_AT=[0.3,4.69,7.47,10.78,13.55,15.15,17.65,23.15,27.7,F+.35,F+3.4,F+4.85,K2];
const VO_LEN=[4.14,2.53,3.06,2.62,1.29,2.04,5.26,4.31,5.06,2.89,1.28,2.41,0.68];
const VO_TXT=['في الأفلام والمسلسلات.. المتدين ليه صورة واحدة بس','دايماً مكشّر.. وقافل على نفسه','بيزعّق في الناس.. وبيخاصم الدنيا كلها',
 'وعايش لوحده.. معزول عن الحياة','بس ده مش حقيقي!',null,'المتدين الحقيقي بيصلّي وبيصوم وبيقوم الليل.. وقلبه مرتاح',
 'وبيضحك ويهزّر مع صحابه.. ويلعبوا بلايستيشن كمان!','بيحب أهله وبيبرّهم.. وبيذاكر ويشتغل ويلعب رياضة',
 'التدين عمره ما كان تشدد ولا انعزال..','القاعدة بسيطة:',null,null];
const CAPS=VO_TXT.map((x,i)=>x?[VO_AT[i],VO_AT[i]+VO_LEN[i]+.15,x]:null).filter(Boolean);
let capIdx=-2;
function captions(t){const box=$('capbox');const k=CAPS.findIndex(c=>t>=c[0]&&t<c[1]);
  if(k!==capIdx){capIdx=k;box.innerHTML='';if(k>=0)CAPS[k][2].split(' ').forEach(w=>{const s=document.createElement('span');s.textContent=w;box.appendChild(s);});}
  $('caps').style.opacity=k>=0?1:0;if(k<0)return;const c=CAPS[k];const sp=[...box.children];const span=(c[1]-c[0])*.85;
  box.style.transform=`scale(${.85+.15*back(P(t,c[0],.2))})`;
  sp.forEach((s,i)=>{const a=c[0]+span*i/sp.length,b=c[0]+span*(i+1)/sp.length;const q=P(t,a,.12);
    s.style.opacity=q>0?1:.18;s.style.transform=`translateY(${(1-eout(q))*10}px)`;s.className=(t>=a&&t<b+.05)?'on':'';});}

function vis(id,t){const w=WIN[id];return w&&t>=w[0]&&t<w[1];}
function handAt(t){
  let tip=null;const OFF={x:1300,y:2300};
  SEG.forEach(([id,s,d])=>{if(!vis(id,t))return;const q=drawAt(id,P(t,s,d));if(t>=s&&t<=s+d&&q)tip=q;});
  const drawing=!!tip;
  if(!tip){let prev=null,next=null;SEG.forEach(sg=>{if(sg[1]+sg[2]<t)prev=sg;});for(const sg of [...SEG].sort((a,b)=>a[1]-b[1])){if(sg[1]>t){next=sg;break;}}
    const ta=prev?prev[1]+prev[2]:-9,tb=next?next[1]:99;
    if(prev&&next&&tb-ta<=1.0&&vis(prev[0],t)&&vis(next[0],tb)){const pe=pointAt(prev[0],1),ns=pointAt(next[0],0);const q=eio((t-ta)/(tb-ta));tip={x:pe.x+(ns.x-pe.x)*q,y:pe.y+(ns.y-pe.y)*q};}
    else if(prev&&t<ta+.35&&vis(prev[0],ta)){const pe=pointAt(prev[0],1);const q=eio((t-ta)/.35);tip={x:pe.x+(OFF.x-pe.x)*q,y:pe.y+(OFF.y-pe.y)*q};}
    else if(next&&t>tb-.4&&vis(next[0],tb)){drawAt(next[0],0);const ns=pointAt(next[0],0);if(ns){const q=eio((t-(tb-.4))/.4);tip={x:OFF.x+(ns.x-OFF.x)*q,y:OFF.y+(ns.y-OFF.y)*q};}}}
  const H=$('hand');
  if(tip&&!(t>BR-.05&&t<RA[0])){const vx=window._pt?tip.x-window._pt.x:0;window._pt={x:tip.x,y:tip.y};window._rot=(window._rot||0)*.85+clamp(vx*.35,-7,7)*.15;
    H.style.opacity=1;H.style.transform=`translate(${tip.x}px,${tip.y}px) rotate(${window._rot+Math.sin(t*23)*.8}deg) scale(${.66*(drawing?1:1.05)}) translate(-6px,-107px)`;}
  else H.style.opacity=0;}

const SKIN=[240,196,156];
function seek(t){
  // ===== section visibility =====
  const inMov=t<BR+.4, inReal=t>=BR&&t<F+.6, inFin=t>=F;
  $('mov').style.display=inMov?'':'none';$('real').style.display=inReal?'':'none';$('fin').style.opacity=t>=F+.35?1:0;$('fin').style.display=inFin?'':'none';
  Object.keys(WIN).forEach(id=>{if(id==='g-under')return;$(id).style.display=vis(id,t)?'':'none';});
  // ===== movies =====
  const flick=0.9+0.1*rnd2(t*24);
  $('movBg').style.filter=`brightness(${flick}) sepia(.3)`;$('movSk').style.filter=`brightness(${flick})`;
  $('grain').style.transform=`translate(${Math.floor(rnd2(t*30)*60)-30}px,${Math.floor(rnd2(t*30+5)*60)-30}px)`;
  $('scratch').style.left=(100+rnd2(Math.floor(t*6))*880)+'px';$('scratch').style.opacity=rnd2(t*12)>.5?1:0;
  const pm=P(t,.15,.45);$('pM').style.opacity=pm>0?1:0;$('pM').style.transform=`translateX(-50%) scale(${back(pm,2.2)})`;
  const mt=P(t,.4,.5),mo=1-eout(P(t,MA[0]-.35,.3));$('mTitle').style.opacity=mt*mo;$('mTitle').style.transform=`scale(${(.7+.3*back(mt))*(0.9+0.1*mo)})`;
  // film "jump cut" between movie scenes: quick shake/flash
  let jump=0;MA.forEach(s=>{if(t>s-.08&&t<s+.25)jump=Math.max(jump,1-Math.abs(t-s)/.25);});
  const mpush=1+0.04*((t%5)/5);
