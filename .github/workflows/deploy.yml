name: Deploy to GitHub Pages

# Runs on pushes to the repository's default branch (whatever it is called), on
# demand, and every 3 hours so new YouTube episodes and shorts appear on the
# site without a manual edit (scripts/fetch-videos.mjs reads the channel feed).
# The static export is published to the gh-pages branch, which GitHub Pages
# serves at https://<owner>.github.io/<repo>/.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull latest episodes and shorts from YouTube
        run: node scripts/fetch-videos.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish out/ to gh-pages
        working-directory: out
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
